x-orbit-environment: &orbit-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-orbit}
  POSTGRES_USER: ${POSTGRES_USER:-orbit}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit-local-only}
  REDIS_URL: redis://redis:6379/0

services:
  api:
    build:
      context: ./backend
    image: orbit-api:local
    environment:
      <<: *orbit-environment
      ORBIT_API_KEY: ${ORBIT_API_KEY:-}
      ORBIT_AUTH_REQUIRED: ${ORBIT_AUTH_REQUIRED:-false}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ORBIT_TEST_GENERATION_MODEL: ${ORBIT_TEST_GENERATION_MODEL:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    image: orbit-api:local
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *orbit-environment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: orbit-api:local
    build:
      context: ./backend
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=qa-runs
      - --concurrency=1
    user: "0:0"
    environment:
      <<: *orbit-environment
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: orbit-api:local
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *orbit-environment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
